<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Move car</title>
</head>
<body>
    <main>
        <h1>Move {{ car.name }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Move car</button>
            <a href="{% url 'cars:list' %}">Cancel</a>
        </form>
    </main>
</body>
</html>
