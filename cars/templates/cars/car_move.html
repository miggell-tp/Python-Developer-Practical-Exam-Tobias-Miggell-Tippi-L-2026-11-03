{% extends "cars/base.html" %}

{% block title %}Move car{% endblock %}

{% block content %}
    <header class="ledger-heading">
        <div>
            <h1>Move car</h1>
            <p>{{ car.name }} · ID {{ car.pk }}</p>
        </div>
    </header>

    <form method="post" class="ledger-panel ledger-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="ledger-primary">Move car</button>
            <a href="{% url 'cars:list' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
