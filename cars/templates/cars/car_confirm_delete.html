{% extends "cars/base.html" %}

{% block title %}Delete car{% endblock %}

{% block content %}
    <header class="ledger-heading">
        <div>
            <h1>Delete car</h1>
            <p>{{ object.name }} · ID {{ object.pk }}</p>
        </div>
    </header>

    <form method="post" class="ledger-panel ledger-form">
        {% csrf_token %}
        <p>Delete <strong>{{ object.name }}</strong> from the inventory? This cannot be undone.</p>
        <div class="form-actions">
            <button type="submit" class="ledger-primary">Delete car</button>
            <a href="{% url 'cars:list' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
